    <script>
      /*
      Apply the color scheme before the JavaScript bundle is evaluated,
      it prevents a white flash when the user has dark mode enabled.
      NOTE: Keep the storage key in sync with src/components/theme-provider.tsx
      */
      (function () {
        var theme = null;

        try {
          theme = localStorage.getItem("keycloakify-ui-theme");
        } catch (_) {}

        var isDarkModeEnabled = theme === "dark";

        if (theme !== "dark" && theme !== "light") {
          try {
            isDarkModeEnabled = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (_) {}
        }

        document.documentElement.classList.toggle("dark", isDarkModeEnabled);
        document.documentElement.style.colorScheme = isDarkModeEnabled ? "dark" : "light";
      })();
    </script>
